[package]
name = "feedgram"
version = "0.1.0"
description = "feedgram native Android application"
authors = ["feedgram contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "feedgram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde_json = "1"
