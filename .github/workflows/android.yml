name: Build Feedgram Android (Tauri 2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
      
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project if it is not present
        shell: bash
        run: |
          if [ ! -f src-tauri/gen/android/gradlew ]; then
            npm run tauri:android:init
          fi
          chmod +x src-tauri/gen/android/gradlew

      
      # Configure release builds to use the automatically generated
      # Android debug signing key (testing only).
      - name: Configure release APK signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path(
              "src-tauri/gen/android/app/build.gradle.kts"
          )

          if not gradle_file.exists():
              raise SystemExit(f"Missing Gradle file: {gradle_file}")

          content = gradle_file.read_text()

          pattern = re.compile(
              r'^([ \t]*)getByName\("release"\)\s*\{',
              re.MULTILINE
          )

          match = pattern.search(content)

          if not match:
              raise SystemExit(
                  "Could not find release build configuration in Gradle file."
              )

          signing_line = (
              match.group(1)
              + '    signingConfig = signingConfigs.getByName("debug")'
          )

          # Avoid inserting the configuration twice.
          if signing_line not in content:
              newline = content.find("\n", match.end())

              if newline == -1:
                  raise SystemExit("Unexpected Gradle file format.")

              content = (
                  content[:newline + 1]
                  + signing_line + "\n"
                  + content[newline + 1:]
              )

              gradle_file.write_text(content)

          print("Release APK will use debug signing for testing.")
          PY

      - name: Generate Tauri application icons
        run: npx tauri icon src-tauri/app-icon.png

      - name: Build optimized release APKs
        run: npm run tauri:android:build -- --split-per-abi

      - name: Confirm APK output
        run: |
          find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print
          test -n "$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: feedgram-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
