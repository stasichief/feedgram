name: Build Feedgram Android (Tauri 2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project if it is not present
        shell: bash
        run: |
          if [ ! -f src-tauri/gen/android/gradlew ]; then
            npm run tauri:android:init
          fi
          chmod +x src-tauri/gen/android/gradlew

      # Debug builds use Android's debug signing key, so the APK can be
      # installed for testing without configuring a private release keystore.
      - name: Build debug APK
        run: npm run tauri:android:build -- --debug

      - name: Confirm APK output
        run: |
          find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print
          test -n "$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print -quit)"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: feedgram-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
